name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Releases run the full e2e surface: the standard deterministic suite plus
  # the LLM-judge group (*.judge.test.ts), which needs OPENAI_API_KEY and is
  # deliberately kept out of the per-push CI.
  e2e-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C "$HOME/.cargo/bin"
      - run: scripts/build-e2e.sh
      - uses: actions/setup-node@v6
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - name: Serve dist
        run: |
          python3 -m http.server 8080 --directory e2e/dist &
          timeout 15 bash -c 'until curl -sf http://localhost:8080 >/dev/null; do sleep 0.5; done'
      - name: Run standard e2e suite
        run: xvfb-run -a npx vitest run
        working-directory: e2e
      - name: Run LLM-judge e2e suite
        run: xvfb-run -a npm run test:judge
        working-directory: e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # The macOS artifact is built on its own runner and handed to the release job
  # as a workflow artifact rather than published from here. Two jobs both
  # calling action-gh-release for the same tag would race to create the
  # release; one publisher avoids that entirely.
  build-macos:
    needs: e2e-full
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # CI's test-macos job only runs on push/PR, and tags hit neither, so the
      # portable tiers are re-run here rather than shipping unverified.
      - run: cargo test
      # LSUIElement is on by the build script's own default now that the
      # menu-bar status item exists to quit from; see the comment beside
      # AGENT_MODE in scripts/build-macos-app.sh.
      - name: Build .app and DMG
        run: UNIVERSAL=1 DMG=1 ./scripts/build-macos-app.sh
      - run: mv target/macos/Nudge-*.dmg "nudge-${{ github.ref_name }}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: nudge-*.dmg
          if-no-files-found: error

  release:
    needs: [e2e-full, build-macos]
    runs-on: ubuntu-latest
    # `actions: read` lets SignPath fetch the unsigned exe from this run.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: rustup target add x86_64-pc-windows-gnu
      # No rust-cache here: SignPath's origin verification wants the signed
      # exe built from the repository alone, not from a previous run's cache.
      - run: cargo build --release --bin nudge --target x86_64-pc-windows-gnu
      - run: cp target/x86_64-pc-windows-gnu/release/nudge.exe "nudge-${{ github.ref_name }}-x86_64-windows.exe"
      # Signing runs once the SignPath project exists: the repository
      # variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN.
      # Without them the release ships the exe unsigned.
      - name: Version without the tag's v
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned exe for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          path: nudge-${{ github.ref_name }}-x86_64-windows.exe
          archive: false
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nudge
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # The approval is a person clicking in SignPath's UI.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: true
          # The artifact configuration pins the exe's VERSIONINFO to this.
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
      - name: Replace the exe with the signed one
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: mv "signed/nudge-${{ github.ref_name }}-x86_64-windows.exe" .
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            nudge-${{ github.ref_name }}-x86_64-windows.exe
            nudge-${{ github.ref_name }}-macos-universal.dmg
          generate_release_notes: true
          body: |
            ### Windows

            Run the exe; there is no installer. [Code signing policy](https://github.com/Wizard1209/nudge#code-signing-policy)

            ### macOS

            The `.app` inside the DMG carries an ad-hoc signature, not a
            Developer ID, so Gatekeeper blocks it on first launch — and macOS 15
            removed the Control-click override that used to get past that. After
            dragging it to Applications, run:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Nudge.app
            ```

            or open it once via System Settings › Privacy & Security › Open Anyway.
