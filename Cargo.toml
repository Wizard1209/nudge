[package]
name = "nudge"
version = "0.1.0"
edition = "2024"
description = "Interval journaling for focus — a periodic spotlight popup for Windows that asks what you're doing and appends the answers to an NDJSON journal"
license = "MIT"
repository = "https://github.com/Wizard1209/nudge"
readme = "README.md"

[lib]
name = "nudge_web"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nudge"
path = "src/main.rs"

[dependencies]
# eframe 0.34 flipped its default renderer from glow → wgpu. On Windows the
# wgpu/DX12 backend only reports `CompositeAlphaMode::Opaque`, so egui-wgpu
# can't honor `with_transparent(true)` and the spotlight overlay renders as an
# opaque black block (egui-wgpu winit.rs alpha-mode fallback → Auto/Opaque).
# glow honors Win32 transparent windows directly, exactly as the 0.31 default
# did. The 0.34 idle-CPU fix lives in the SHARED native run loop
# (run.rs::check_redraw_requests), not in the wgpu integration, so it survives
# on glow. Dropping wgpu also sheds the wgpu-hal/gpu-allocator tree that forced
# the `windows = "=0.62.0"` pin below.
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
chrono = "0.4"
web-time = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"

# The menu-bar / notification-area status item, on both shipping platforms.
# One version for both so the icon, the menu and the tooltip are literally the
# same code path; `platform::{windows,macos}` differ only in which thread owns
# the item and what wakes the app.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_Security"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Revealing a hidden window needs an AppKit activation call: with
# `ViewportCommand::Focus` alone the popup appears but never becomes key, so
# `viewport().focused` stays false and every keystroke — Esc included — is
# swallowed. `platform::macos::focus_popup` is the only user.
#
# Pinned to the 0.2 line on purpose: that is what winit 0.30 and
# accesskit_macos already link, so this adds no crate to the build. Bump both
# together when winit moves to objc2 0.6, not before — two objc2 trees in one
# binary is a cost with no benefit.
objc2-app-kit = "0.2"
objc2-foundation = "0.2"
# Global hotkey. On macOS this crate registers through Carbon's
# `RegisterEventHotKey`, which needs no TCC grant and fires while the app is
# unfocused — measured, including from a launchd-parented unsigned bundle, with
# no permission dialog. That property is conditional on the binding: a media
# key switches the crate onto a `CGEventTap`, which *does* need Input
# Monitoring. `crate::hotkey`'s key allowlist (letters, digits, F1..F24, Space,
# Enter, Tab, Escape, Backspace) contains no media key, so the Carbon path is
# the only one this app can reach.
global-hotkey = "0.8"
# `flock` for the settings-window single-instance lockfile — the macOS
# counterpart of the named Win32 mutex. Already in the tree via winit, so this
# adds no crate to the build.
libc = "0.2"
# `EventLoopBuilderExtMacOS::with_activation_policy`, the only way to ask for
# `NSApplicationActivationPolicy::Accessory` *before* the app finishes
# launching. eframe does not re-export `egui_winit` (and therefore not
# `winit`), so it has to be named here. `default-features = false` adds no
# feature of our own — cargo unifies with what eframe already turns on — and
# the version tracks eframe 0.34's winit 0.30 exactly, so this adds no crate
# to the build. Bump it in lockstep with eframe.
winit = { version = "0.30", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
# Filesystem watcher for live-reloading config.json edits made by the settings
# UI (or by hand). Wraps native OS APIs (ReadDirectoryChangesW / inotify /
# FSEvents) so the watcher thread sleeps in the kernel and costs ~0 CPU at
# idle — important because `tests/perf_idle.rs` ratchets the idle-CPU budget
# down to 25 ms/s. Default features are fine on all desktop targets; the
# crate is fully cfg-gated out of wasm via the `cfg(not(target_arch = "wasm32"))`
# scope so the browser build never pulls it in.
notify = "8"

[dev-dependencies]
tempfile = "3"
# Used only by the #[ignore]'d native capture tests: encode the window grab to
# PNG (image) and submit it to an LLM vision judge over HTTPS (ureq + base64).
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
# Headless AccessKit-driven tests against the real eframe apps (tests/kittest_card.rs).
# Deliberately NOT the `snapshot` or `wgpu` features: snapshot rendering is only
# implemented for egui_kittest's wgpu backend, and this project deliberately ships
# glow (see the comment above the `eframe` dependency). Turning `wgpu` on here would
# unify it back into every `cargo test`, and its rendered pixels would not be the
# pixels the app actually ships anyway — the WASM e2e tier already asserts on real
# glow output, so pixel assertions belong there, not in this tier.
egui_kittest = { version = "0.34", features = ["eframe"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics = "0.23"
core-foundation = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element", "Storage"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
